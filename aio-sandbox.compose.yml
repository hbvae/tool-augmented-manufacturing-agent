services:
  aio-sandbox:
    image: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:1.11.0
    container_name: manufacturing-aio-sandbox
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SANDBOX_API_KEY: "${AIO_SANDBOX_API_KEY:?AIO_SANDBOX_API_KEY must be set}"
      WORKSPACE: /home/gem/workspace
      TZ: Asia/Shanghai
    volumes:
      - manufacturing_aio_workspace:/home/gem/workspace
    networks:
      - sandbox_internal
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    shm_size: 512m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined

  aio-gateway:
    image: nginx:1.27-alpine
    container_name: manufacturing-aio-gateway
    restart: unless-stopped
    depends_on:
      aio-sandbox:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./aio-sandbox-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sandbox_internal
      - gateway_bridge
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true

volumes:
  manufacturing_aio_workspace:

networks:
  sandbox_internal:
    internal: true
  gateway_bridge:
